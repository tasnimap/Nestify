name: Deploy Nestify API

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  API_PROJECT: src/Nestify.Api/Nestify.Api.csproj
  PUBLISH_DIRECTORY: ./publish

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and publish API
    runs-on: ubuntu-latest
